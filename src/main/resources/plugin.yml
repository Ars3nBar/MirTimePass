name: MirTimePass
version: '2.6.0'
main: ru.mirtime.pass.MirTimePass
api-version: '1.21'
softdepend:
  - PlaceholderAPI
  - GemsEconomy
  - PlayerPoints
  - MirTimeItems
commands:
  battlepass:
    description: Открыть меню Боевого Пропуска MIR-TIME
    aliases: [bp, pass, бп]
  mtpass:
    description: Управление сезонами и выдача ключей Боевого Пропуска
    permission: mirtime.pass.admin
permissions:
  mirtime.pass.admin:
    description: Смена сезона, выдача ключей и опыта
    default: op
